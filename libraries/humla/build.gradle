plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.protobuf)
}

tasks.withType(JavaCompile).configureEach {
    // TODO include deprecations at some point, but currently they are *many*
    options.compilerArgs << "-Xlint:all" << "-Xlint:-deprecation" << "-Xlint:-dep-ann"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

android {
    namespace = 'se.lublin.humla'

    compileSdk = 36
    buildToolsVersion = '36.1.0'
    // Single-sourced from gradle.properties; see the comment there for why drift here is
    // dangerous (silently unstripped native libraries, not a build failure).
    ndkVersion = providers.gradleProperty('ndkVersion').get()

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    sourceSets {
        main {
            proto {
                // Mumble.proto lives next to src/main, not in the plugin's default src/main/proto
                srcDir 'src'
                include '*.proto'
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }

    externalNativeBuild {
        cmake {
            path = file('src/main/cpp/CMakeLists.txt')
            version = '4.1.2'
        }
    }

    defaultConfig {
        minSdk = 31
        testApplicationId = "se.lublin.humla.test"

        ndk {
            abiFilters += ['arm64-v8a', 'armeabi-v7a', 'x86_64']
        }
        externalNativeBuild {
            cmake {
                // Static libc++: every humla_*.so is self-contained, exports only C JNI
                // entry points and shares no C++ objects or exceptions across libraries,
                // so the NDK's warning about duplicated libc++ state does not apply.
                arguments += ['-DANDROID_STL=c++_static']
            }
        }
    }

    testOptions {
        targetSdk = 36
        unitTests {
            includeAndroidResources = true
            all {
                // See app/build.gradle: Robolectric needs jdk.internal.access opened on JDK 21.
                jvmArgs '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED'
            }
        }
    }

    lint {
        targetSdk = 36
        abortOnError = true
        // InvalidPackage: see app/build.gradle
        disable 'InvalidPackage', 'MissingTranslation'
        explainIssues = true
        ignoreWarnings = false
        quiet = false
    }
}

// The protobuf Gradle plugin's process*ProtoResources tasks copy Mumble.proto into this
// module's Java resources so it rides along in the AAR and ends up in the shipped APK
// (verified: android.packaging.resources.excludes on this library module does not stop the
// app module's mergeJavaResource step from picking it up through the project dependency).
// We only generate Java classes from Mumble.proto, never need the source .proto at runtime,
// so disable the copy outright instead.
tasks.configureEach { task ->
    if (task.name.endsWith('ProtoResources')) {
        task.enabled = false
    }
}

protobuf {
    protoc {
        artifact = libs.protobuf.protoc.get().toString()   // com.google.protobuf:protoc:4.36.2
    }
    generateProtoTasks {
        all().configureEach { task ->
            task.builtins {
                java { }
            }
        }
    }
}

dependencies {
    api libs.protobuf.java
    api libs.bouncycastle.prov
    api libs.bouncycastle.pkix

    implementation libs.kotlinx.coroutines.android
    implementation libs.androidx.annotation
    implementation libs.jetbrains.annotations
    implementation libs.minidns.hla
    implementation libs.minidns.android21

    testImplementation libs.bundles.unit.test
}
