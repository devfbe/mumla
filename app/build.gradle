plugins {
    alias(libs.plugins.android.application)
}

def signingFile = file 'signing.gradle'
if (signingFile.exists()) apply from: signingFile
def signingBetaFile = file 'signing-beta.gradle'
if (signingBetaFile.exists()) apply from: signingBetaFile

tasks.withType(JavaCompile).configureEach {
    // TODO include deprecations at some point, but currently they are *many*
    options.compilerArgs << "-Xlint:all" << "-Xlint:-deprecation" << "-Xlint:-dep-ann"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

android {
    namespace = 'se.lublin.mumla'
    compileSdk = 36
    // Single-sourced from gradle.properties; see the comment there.
    buildToolsVersion = providers.gradleProperty('buildToolsVersion').get()
    // Single-sourced from gradle.properties; must match libraries/humla's ndkVersion, which reads
    // the same property. Without it AGP looks for its own default NDK, which the dev shell does
    // not install, and stripFoss*DebugSymbols silently packages the humla_*.so files unstripped.
    ndkVersion = providers.gradleProperty('ndkVersion').get()

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    base {
        archivesName = "mumla"
    }

    buildFeatures {
        buildConfig = true
    }

    def gitDescribe = providers.exec {
        // Need --always because there are no tags in gitlab ci (right?)
        commandLine "git", "describe", "--tags", "--match", "[0-9]*.[0-9]*.[0-9]*", "--always"
    }.standardOutput.asText.get().trim()

    defaultConfig {
        minSdk = 31
        targetSdk = 36

        applicationId = "se.lublin.mumla"
        // Remember: app_news_items_vX_Y_Z in src/main/res/values/strings.xml
        // and NEWS_ITEMS in src/main/res/java/se/lublin/mumla/app/DialogUtils.java
        //     code:XYYZZbb (bb for build)
        versionCode = 3070300
        versionName = gitDescribe

        buildConfigField "long", "TIMESTAMP", System.currentTimeMillis() + "L"
        buildConfigField "String", "VERSIONTAG", "\"" + gitDescribe.split("-")[0] + "\""
    }

    flavorDimensions += ["release"]
    productFlavors {
        goog {
            dimension = "release"
            applicationId = "se.lublin.mumla"
        }
        foss {
            dimension = "release"
            applicationId = "se.lublin.mumla"
        }
        donation {
            dimension = "release"
            applicationId = "se.lublin.mumla.donation"
        }
        beta {
            dimension = "release"
            applicationId = "se.lublin.mumla.beta"
        }
    }

    buildTypes {
        // signingConfig beta will override
        release {
            if (android.hasProperty("signingConfigs")) {
                if (signingConfigs.hasProperty("release")) {
                    signingConfig = signingConfigs.release
                }
                if (signingConfigs.hasProperty("beta")) {
                    signingConfig = signingConfigs.beta
                }
            }
        }
        debug {
            versionNameSuffix = "-debug"
            if (android.hasProperty("signingConfigs")) {
                if (signingConfigs.hasProperty("beta")) {
                    signingConfig = signingConfigs.beta
                }
            }
        }
    }

    packaging {
        resources {
            // protobuf-java ships the 12 well-known-type sources (any.proto, descriptor.proto
            // and friends, about 120 KB) as Java resources under this directory, which holds
            // nothing else -- the generated classes live under com/google/protobuf and carry
            // their descriptors in bytecode, so nothing at runtime reads a .proto file. The
            // companion fix in libraries/humla/build.gradle keeps our own Mumble.proto out of the
            // APK; this keeps the vendored ones out. The pattern is anchored with a leading
            // slash, which is what AGP matches against the archive entry path; without it the
            // entries still ship.
            excludes += '/google/protobuf/**'
            // bcprov, bcpkix and bcutil each ship a META-INF/LICENSE.md (today all three are the
            // byte-identical MIT License text for The Legion of the Bouncy Castle Inc.). Merge
            // rather than pick one: merging concatenates the copies, so if a future BouncyCastle
            // release diverges in one jar -- an added third-party attribution, say -- that notice
            // still ships. Picking the first copy would drop it silently, on a green build.
            merges += 'META-INF/LICENSE.md'
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                // Robolectric's FileDescriptor interceptor reaches jdk.internal.access.SharedSecrets,
                // which JDK 21 does not export to the unnamed module; SDK 36's
                // ApplicationSharedMemory goes through it, so without this every Robolectric test
                // dies in setUpApplicationState.
                jvmArgs '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED'
                // Gradle's default test worker heap is 512m and the whole module runs in one
                // worker. Robolectric holds the framework resources of every @Config(sdk = ...)
                // it has seen, so the cost grows with the suite and not with the test: measured
                // here, NotificationPostingTest died with "OutOfMemoryError: Failed to load
                // android-all-instrumented-13" in the full run and passed on its own, at a suite
                // size of 226. That is a harness limit reading as eight red tests, which is the
                // shape section 4.05 warns about, so it is raised rather than worked around.
                maxHeapSize = '1g'
            }
        }
    }

    lint {
        abortOnError = true
        // InvalidPackage: the crypto provider references javax.naming / java.awt classes that
        // Android does not ship and that are never reached at runtime.
        disable 'InvalidPackage', 'MissingTranslation'
        // Plural forms in translated resources belong to Weblate; spec section 2 forbids editing
        // translation files, so this check reports but does not fail the build. It stays enabled
        // for the English source, where it would be a real error we can fix.
        warning 'MissingQuantity'
        // Default severity is warning, which abortOnError does not gate. Raised to error so a
        // missing/misspelled android:dataExtractionRules attribute (e.g. res/xml/backup_rules.xml
        // becoming unreferenced) fails the build instead of silently re-enabling cloud backup of
        // server passwords and the client certificate. ManifestAuditTest's
        // theBackupRulesFileExcludesCloudBackupButNotDeviceTransfer resolves the rules resource by
        // name, so it cannot see this wiring break; this lint check is what actually enforces it.
        error 'DataExtractionRules'
        explainIssues = true
        ignoreWarnings = false
        quiet = false
    }
}

// betas may be released every minute
androidComponents {
    onVariants(selector().withFlavor("release", "beta")) { variant ->
        variant.outputs.each { output ->
            output.versionCode.set((int) (System.currentTimeMillis() / 60000L))
        }
    }
}

dependencies {
    implementation project(":libraries:humla")
    implementation libs.kotlinx.coroutines.android
    implementation libs.androidx.appcompat
    implementation libs.androidx.activity
    implementation libs.androidx.cardview
    implementation libs.androidx.core.ktx
    implementation libs.androidx.documentfile
    implementation libs.androidx.fragment
    implementation libs.androidx.media
    implementation libs.androidx.recyclerview
    implementation libs.androidx.exifinterface
    implementation libs.material
    implementation libs.androidx.preference
    implementation libs.jsoup
    implementation libs.netcipher

    googImplementation libs.billing

    testImplementation libs.bundles.unit.test
}
