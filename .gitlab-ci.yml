# Builds and tests Mumla inside the Nix dev shell defined by flake.nix.
image: nixos/nix:latest

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  NIX_CONFIG: "experimental-features = nix-command flakes"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  DEVSHELL: ".#devShells.x86_64-linux.default"

cache:
  # Per branch, so concurrent branches do not overwrite each other's caches; new branches start
  # from the default branch's cache.
  key: ${CI_PROJECT_ID}-${CI_COMMIT_REF_SLUG}-nix-gradle
  fallback_keys:
    - ${CI_PROJECT_ID}-${CI_DEFAULT_BRANCH}-nix-gradle
    - ${CI_PROJECT_ID}-nix-gradle
  paths:
    - .gradle/caches/
    - .gradle/wrapper/
    - .nix-cache/

stages:
  - build

build:
  stage: build
  before_script:
    - mkdir -p .nix-cache .gradle
    # Realise the dev shell, preferring the file-backed cache restored by GitLab over cache.nixos.org.
    - nix build --print-build-logs --out-link .devshell
        --substituters "file://$CI_PROJECT_DIR/.nix-cache https://cache.nixos.org"
        "$DEVSHELL"
  script:
    # Host-side ctest for the native code (no Gradle task builds it for the host).
    # HUMLA_REQUIRE_SANITIZERS makes a missing ASan/UBSan runtime a configure error instead of
    # silently skipping the sanitized tests; --no-tests=error fails an empty run.
    - nix develop "$DEVSHELL" --command env HUMLA_REQUIRE_SANITIZERS=1
        cmake -S libraries/humla/src/main/cpp/tests -B build/native-tests -G Ninja
    - nix develop "$DEVSHELL" --command cmake --build build/native-tests
    - nix develop "$DEVSHELL" --command ctest --test-dir build/native-tests --output-on-failure --no-tests=error
    # Every lint variant is named: bare `lint` only covers betaDebug. detekt fails only on
    # findings missing from a module's detekt-baseline.xml.
    - nix develop "$DEVSHELL" --command ./gradlew --console=plain assembleFossDebug assembleGoogDebug test
        lintFossDebug lintGoogDebug lintDonationDebug lintBetaDebug :libraries:humla:lintDebug detekt
  after_script:
    # Export the dev shell closure so the next pipeline does not rebuild the SDK/NDK.
    - nix copy --to "file://$CI_PROJECT_DIR/.nix-cache" "$DEVSHELL" || true
  artifacts:
    when: always
    paths:
      - app/build/outputs/apk/
      - app/build/reports/
      - libraries/humla/build/reports/
      - libraries/humla-protocol/build/reports/
      - app/build/test-results/
      - libraries/humla/build/test-results/
      - libraries/humla-protocol/build/test-results/
    expire_in: 3 months
