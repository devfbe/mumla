# Builds and tests Mumla inside the Nix dev shell defined by flake.nix.
image: nixos/nix:latest

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  NIX_CONFIG: "experimental-features = nix-command flakes"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  DEVSHELL: ".#devShells.x86_64-linux.default"

cache:
  # Scoped per branch: four modernization streams run CI concurrently and a single shared key
  # makes them overwrite each other's Gradle and Nix caches on every push. A new branch starts
  # from the default branch's cache, or from the old shared key if that does not exist yet.
  key: ${CI_PROJECT_ID}-${CI_COMMIT_REF_SLUG}-nix-gradle
  fallback_keys:
    - ${CI_PROJECT_ID}-${CI_DEFAULT_BRANCH}-nix-gradle
    - ${CI_PROJECT_ID}-nix-gradle
  paths:
    - .gradle/caches/
    - .gradle/wrapper/
    - .nix-cache/

stages:
  - build

build:
  stage: build
  before_script:
    - mkdir -p .nix-cache .gradle
    # Realise the dev shell, preferring the file-backed cache restored by GitLab over cache.nixos.org.
    - nix build --print-build-logs --out-link .devshell
        --substituters "file://$CI_PROJECT_DIR/.nix-cache https://cache.nixos.org"
        "$DEVSHELL"
  script:
    # Host-side ctest for the native C code under src/main/cpp. No Gradle task compiles that
    # code for the host, so without these three lines the only direct test of native code in
    # the repo never runs anywhere. Kept deliberately plain -- configure, build, run; ctest's
    # non-zero exit fails the job. Native code added later belongs in the same tests/ directory
    # and is picked up here for free; do not add a second mechanism.
    - nix develop "$DEVSHELL" --command cmake -S libraries/humla/src/main/cpp/tests -B build/native-tests -G Ninja
    - nix develop "$DEVSHELL" --command cmake --build build/native-tests
    - nix develop "$DEVSHELL" --command ctest --test-dir build/native-tests --output-on-failure
    # Every lint variant is named explicitly: the bare `lint` task resolves to :app:lintBetaDebug
    # only, which would leave foss (the F-Droid ship target), goog and donation unlinted even
    # though each has its own source set.
    - nix develop "$DEVSHELL" --command ./gradlew --console=plain assembleFossDebug assembleGoogDebug test
        lintFossDebug lintGoogDebug lintDonationDebug lintBetaDebug :libraries:humla:lintDebug
  after_script:
    # Export the dev shell closure so the next pipeline does not rebuild the SDK/NDK.
    - nix copy --to "file://$CI_PROJECT_DIR/.nix-cache" "$DEVSHELL" || true
  artifacts:
    when: always
    paths:
      - app/build/outputs/apk/
      - app/build/reports/
      - libraries/humla/build/reports/
      - app/build/test-results/
      - libraries/humla/build/test-results/
    expire_in: 3 months
