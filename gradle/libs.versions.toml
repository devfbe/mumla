[versions]
# Kotlin is compiled by AGP's built-in Kotlin support: the compiler is the Kotlin Gradle plugin
# that AGP itself resolves (2.2.10 via AGP 9.4.1), so this catalog declares no `kotlin` version and
# no kotlin-gradle-plugin. Adding one would put a second KGP on the build classpath.
# Use `kotlin { compilerOptions { ... } }` in a module to change the Kotlin language level.
agp = "9.4.1"
coroutines = "1.11.0"

androidx-appcompat = "1.8.0"
androidx-activity = "1.13.0"
androidx-annotation = "1.11.0"
androidx-cardview = "1.0.0"
androidx-core = "1.18.0"
androidx-documentfile = "1.1.0"
androidx-exifinterface = "1.4.2"
androidx-fragment = "1.9.0"
androidx-media = "1.8.0"
androidx-lifecycle = "2.11.0"
androidx-preference = "1.2.1"
androidx-recyclerview = "1.4.0"
material = "1.14.0"
billing = "9.1.0"

protobuf = "4.36.2"
protobuf-plugin = "0.10.0"
detekt = "1.23.8"
bouncycastle = "1.86"
minidns = "1.1.1"

junit = "4.13.2"
robolectric = "4.17"
mockk = "1.14.11"
truth = "1.4.5"
androidx-test-core = "1.7.0"

[libraries]
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
detekt-gradlePlugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "androidx-activity" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }
androidx-cardview = { module = "androidx.cardview:cardview", version.ref = "androidx-cardview" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "androidx-documentfile" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "androidx-exifinterface" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "androidx-fragment" }
androidx-media = { module = "androidx.media:media", version.ref = "androidx-media" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-preference = { module = "androidx.preference:preference", version.ref = "androidx-preference" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "androidx-recyclerview" }
material = { module = "com.google.android.material:material", version.ref = "material" }
billing = { module = "com.android.billingclient:billing", version.ref = "billing" }

protobuf-javalite = { module = "com.google.protobuf:protobuf-javalite", version.ref = "protobuf" }
protobuf-protoc = { module = "com.google.protobuf:protoc", version.ref = "protobuf" }
bouncycastle-prov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
minidns-hla = { module = "org.minidns:minidns-hla", version.ref = "minidns" }
minidns-android23 = { module = "org.minidns:minidns-android23", version.ref = "minidns" }

junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
# FragmentScenario and the empty host activity it needs. Deliberately on the same version ref
# as `androidx-fragment`: the two are one library split across two artifacts, and pinning the
# test half a version behind the main one only invites a resolution bump nobody chose.
androidx-fragment-testing = { module = "androidx.fragment:fragment-testing", version.ref = "androidx-fragment" }
androidx-fragment-testing-manifest = { module = "androidx.fragment:fragment-testing-manifest", version.ref = "androidx-fragment" }

[bundles]
unit-test = ["junit", "robolectric", "mockk", "truth", "kotlinx-coroutines-test", "androidx-test-core"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-plugin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
