android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true

# Single source for the NDK version: libraries/humla/build.gradle and app/build.gradle both read
# this property instead of hardcoding the literal. A mismatch between the app and the library
# module does not fail the build -- AGP falls back to its own default NDK and
# stripFoss*DebugSymbols silently packages the humla_*.so files unstripped (discovered in Task 9,
# cost 4.8 MB of APK). Must be kept in sync by hand with the `ndkVersion` binding in flake.nix,
# which Nix cannot read this file to pick up automatically.
ndkVersion=29.0.14206865
