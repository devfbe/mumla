android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
# The daemon JVM (gradle/gradle-daemon-jvm.properties) is the JDK 21 that the dev shell and the
# Studio launcher export as JAVA_HOME; Studio's own runtime is a newer JBR that does not match.
org.gradle.java.installations.fromEnv=JAVA_HOME

# Android toolchain versions for all modules (the root build rejects module overrides).
# Keep in sync with flake.nix.
ndkVersion=29.0.14206865
buildToolsVersion=37.0.0
cmakeVersion=4.1.2
