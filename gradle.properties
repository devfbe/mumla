android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true

# Single source for the Android toolchain versions: libraries/humla/build.gradle and
# app/build.gradle read these properties instead of hardcoding the literals, and the root
# build.gradle asserts at configuration time that nothing overrides them. A mismatch between the
# app and the library module does not fail the build on its own -- AGP falls back to its own
# default NDK and stripFoss*DebugSymbols silently packages the humla_*.so files unstripped
# (discovered in Task 9, cost 4.8 MB of APK). All three must be kept in sync by hand with the
# matching bindings in flake.nix, which Nix cannot read this file to pick up automatically.
ndkVersion=29.0.14206865
buildToolsVersion=36.1.0
cmakeVersion=4.1.2
